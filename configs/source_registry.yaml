# Source Registry and Evidence Confidence Hierarchy
# Strict Source Truth Hierarchy:
# Tier 1: Official Patch Notes (Infinity Ward / Activision)
# Tier 2: Controlled Measured Tests (Frame-by-frame 240fps/120fps video captures, private match distance markers)
# Tier 3: Reproducible Public Testing (Community spreadsheets, weapon breakdown creators with published methods)
# Tier 4: Community Leads / AI suggestions (Unverified rumors, datamine whispers, raw OCR, AI claims)

source_tiers:
  tier_1:
    name: "Tier 1: Official Patch Notes"
    description: "First-party Activision / Infinity Ward official changelogs, patch notes, and blog announcements."
    base_confidence: 0.98
    requires_review: false
    auto_verify: true

  tier_2:
    name: "Tier 2: Controlled Measured Tests"
    description: "High-speed (120-240fps) frame-by-frame video capture testing in controlled private matches with fixed distance markers."
    base_confidence: 0.92
    requires_review: false
    auto_verify: true

  tier_3:
    name: "Tier 3: Reproducible Public Testing"
    description: "Verified community database releases with public methodologies, test scripts, or corroborating community test sets."
    base_confidence: 0.78
    requires_review: false
    auto_verify: false

  tier_4:
    name: "Tier 4: Community Leads & AI Drafts"
    description: "Unverified community observations, automated screenshot OCR drafts, or AI-synthesized claims. Must be queued in AI Review Queue."
    base_confidence: 0.40
    requires_review: true
    auto_verify: false

# Registered Sources with assigned tiers
registered_sources:
  # Tier 1: Official First-Party Sources
  - source_id: "official_callofduty_blog"
    name: "Official Call of Duty Blog & Patch Notes"
    tier: "tier_1"
    url: "https://www.callofduty.com/patchnotes"
